# Local defaults (localhost:27017, no auth). In Kubernetes these are
# overridden by environment variables, e.g. SPRING_DATA_MONGODB_HOST.
spring.data.mongodb.database=belajar_db
spring.data.mongodb.port=27017

# Health endpoints used by Kubernetes probes:
#   /actuator/health/liveness  and  /actuator/health/readiness
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
