# kind cluster definition: 1 control-plane + 2 workers.
# Create:  kind create cluster --name demo-cluster --config k8s/kind-config.yaml
#
# Ports 80/443 on your PC are forwarded into the control-plane node, where
# Traefik (the Ingress controller) listens. That's how http://mylocal.localhost
# reaches the cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"      # Traefik is pinned to this node (see traefik-values.yaml)
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
