# A plain Pod (no Deployment around it). The kubelet restarts its container
# if it crashes, but if you delete the Pod (or its node dies) NOTHING
# recreates it. That's the difference from a Deployment.
#
# It just sleeps, so you can open a MongoDB shell inside the cluster:
#   kubectl exec -it mongo-client -n demo-namespace -- sh -c \
#     'mongosh "mongodb://$MONGO_INITDB_ROOT_USERNAME:$MONGO_INITDB_ROOT_PASSWORD@mongodb:27017/belajar_db?authSource=admin"'
#   > db.tutorials.find()
apiVersion: v1
kind: Pod
metadata:
  name: mongo-client
  labels:
    app: mongo-client
spec:
  containers:
    - name: mongosh
      image: mongo:7
      command: ["sleep", "infinity"]
      envFrom:
        - secretRef:
            name: mongodb-secret
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 256Mi
  restartPolicy: Always
