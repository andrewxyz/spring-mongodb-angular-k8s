# StatefulSet = like a Deployment, but for stateful apps:
#  - pods get fixed names: mongodb-0 (not random suffixes)
#  - each pod gets its OWN PersistentVolumeClaim from volumeClaimTemplates,
#    and keeps it when the pod is deleted/recreated -> data survives.
#
# replicas: 1 on purpose. Two plain mongod pods would be two separate
# databases; real multi-pod MongoDB needs a replica set configuration.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  serviceName: mongodb    # the headless Service that gives pods their DNS names
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - name: mongo
              containerPort: 27017
          # Root user/password come from the Secret (used on first start)
          envFrom:
            - secretRef:
                name: mongodb-secret
          volumeMounts:
            - name: data
              mountPath: /data/db       # where mongod stores its files
          resources:
            requests:                   # what the scheduler reserves
              cpu: 100m
              memory: 256Mi
            limits:                     # hard ceiling
              memory: 1Gi
          # Readiness: "can I receive traffic?"  Liveness: "restart me if stuck"
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
  # One PVC per pod: data-mongodb-0. kind's default StorageClass "standard"
  # (local-path) creates the actual disk on the node automatically.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
