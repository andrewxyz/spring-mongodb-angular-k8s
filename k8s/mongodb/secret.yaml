# Secret = sensitive settings. Kubernetes stores values base64-encoded
# (NOT encrypted). `stringData` lets us write plain text here; Kubernetes
# encodes it for us.
#
# These are LOCAL LEARNING credentials. For anything real, don't commit
# passwords to git; create the Secret from the command line instead:
#   kubectl create secret generic mongodb-secret -n demo-namespace \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=... --from-literal=MONGO_INITDB_ROOT_PASSWORD=...
#
# Note: the mongo image only uses these on the FIRST start (empty disk) to
# create the root user. Changing them later requires deleting the PVC.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  labels:
    app: mongodb
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: belajar
  MONGO_INITDB_ROOT_PASSWORD: belajar-secret-pass
